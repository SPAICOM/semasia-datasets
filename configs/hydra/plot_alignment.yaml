# Result directories (all pairs of all receivers; rows of the figure are receivers)
results_dirs:
  - results/alignment
  - results/alignment_extended_vitl
  - results/alignment_extended_convnext
figure_data: results/figures/alignment_figure_data.csv

# One PDF per entry. rows = receivers, columns = datasets.
#   metric_col: column of the result files (mse | mse_per_sample | nmse | accuracy)
#   no_mismatch: draw the No Mismatch line (accuracy only)
figures:
  - out_pdf: results/figures/alignment.pdf
    metric_col: accuracy
    ylabel: Accuracy
    no_mismatch: true
  - out_pdf: results/figures/alignment_mse.pdf
    metric_col: mse
    ylabel: MSE
    no_mismatch: false

# Receivers in row order; `label` is the row title (rotated, left of the y label)
receivers:
  - model: vit_large_patch16_224.augreg_in21k
    label: ViT-L/16
  - model: convnext_base.fb_in22k
    label: ConvNeXt-B

# Bands: t interval of the mean across the pairs of each receiver
confidence: 0.95

# Methods to plot (proto | cca | linear), in legend order
methods:
  - proto
  - cca
  - linear

labels:
  proto: PPFE
  cca: CCA
  linear: Linear
  no_mismatch: No Mismatch

titles:
  cifar10: CIFAR-10
  mnist: MNIST
  fashion_mnist: Fashion-MNIST

# SPAICOM logo palette
colors:
  linear: "#477BFF"
  cca: "#E13D66"
  proto: "#70D7D0"
  no_mismatch: "#4D4D4D"

font_candidates: [Times New Roman, Tinos, Liberation Serif, STIXGeneral, DejaVu Serif]

mean_linewidth: 1.8
pair_linewidth: 0.9
pair_alpha: 0.35
band_alpha: 0.18
figsize: [12.0, 6.0]
xlabel: Compression (K)
row_title_x: 0.016 # figure coordinates of the row titles
row_title_margin: 0.04 # left margin (figure fraction) kept free for the row titles
